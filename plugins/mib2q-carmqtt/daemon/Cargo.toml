[package]
name = "carmqtt"
version = "0.3.2"
edition = "2021"
description = "MIB2 High car status to Home Assistant over MQTT"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
