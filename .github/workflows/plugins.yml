name: plugins
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  java:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: bike-rack
            project: bike-rack
            path: plugins/bike-rack
          - id: hello-menu
            project: hello-menu
            path: plugins/hello-menu
          - id: inputs-demo
            project: inputs-demo
            path: plugins/inputs-demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: complex256/mib2q-plugin-sdk
          path: sdk
          ref: main
          # A public SDK repo needs no secret (the job token can read it); a private one needs SDK_REPO_TOKEN.
          token: ${{ secrets.SDK_REPO_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish the SDK locally
        working-directory: sdk
        run: ./gradlew publishLocal
      - name: Host mibpkg
        run: |
          curl -fsSL -o mibpkg "$MIBSDK_MIBPKG_URL"
          chmod +x mibpkg
        env:
          MIBSDK_MIBPKG_URL: ${{ vars.MIBSDK_MIBPKG_URL }}
      - name: Test and package
        run: >-
          ./gradlew :plugins:${{ matrix.project }}:test :plugins:${{ matrix.project }}:mibpkgPackage
          -Pmibsdk.repo=file://$GITHUB_WORKSPACE/sdk/build/repo
          -Pmibsdk.mibpkg=$GITHUB_WORKSPACE/mibpkg
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: ${{ matrix.path }}/build/mibsdk/*.mpk
          if-no-files-found: error

  native:
    # Native jobs need the private QNX GHCR images and GHCR_TOKEN. Set the
    # repository variable NATIVE_CI=true once those are in place.
    if: vars.NATIVE_CI == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: tailscale
            project: mib2q-tailscale:daemon
            path: plugins/mib2q-tailscale/daemon
            image: ghcr.io/complex256/qnx65-armv7-toolchain:8.5-go127
          - id: wireguard
            project: mib2q-wireguard:daemon
            path: plugins/mib2q-wireguard/daemon
            image: ghcr.io/complex256/qnx65-armv7-toolchain:8.5-go127
          - id: carmqtt
            project: mib2q-carmqtt:daemon
            path: plugins/mib2q-carmqtt/daemon
            image: ghcr.io/complex256/qnx65-armv7-toolchain:8.5-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: complex256/mib2q-plugin-sdk
          path: sdk
          ref: main
          token: ${{ secrets.SDK_REPO_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish the SDK locally
        working-directory: sdk
        run: ./gradlew publishLocal
      - name: Host mibpkg
        run: |
          curl -fsSL -o mibpkg "$MIBSDK_MIBPKG_URL"
          chmod +x mibpkg
        env:
          MIBSDK_MIBPKG_URL: ${{ vars.MIBSDK_MIBPKG_URL }}
      - name: Log in to private GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - name: Pull the QNX image
        run: docker pull "${{ matrix.image }}"
      - name: Build and package
        run: >-
          ./gradlew :plugins:${{ matrix.project }}:buildDaemon :plugins:${{ matrix.project }}:packageDaemon
          -Pmibsdk.repo=file://$GITHUB_WORKSPACE/sdk/build/repo
          -Pmibsdk.mibpkg=$GITHUB_WORKSPACE/mibpkg
        env:
          QNX_GO_IMAGE: ${{ matrix.image }}
          QNX_RUST_IMAGE: ${{ matrix.image }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: ${{ matrix.path }}/build/mpk/*.mpk
          if-no-files-found: error

  publish:
    # A tag publishes the built packages to the official collection. That collection is a
    # separate repository, so it needs a token with contents:write there (PACKAGES_TOKEN).
    if: >-
      always() && startsWith(github.ref, 'refs/tags/v') &&
      needs.java.result == 'success' && needs.native.result == 'success'
    needs: [java, native]
    runs-on: ubuntu-latest
    concurrency:
      group: official-feed
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Host mibpkg
        run: |
          curl -fsSL -o mibpkg "$MIBSDK_MIBPKG_URL"
          chmod +x mibpkg
        env:
          MIBSDK_MIBPKG_URL: ${{ vars.MIBSDK_MIBPKG_URL }}
      - name: Official source list
        # Keep the feed's sources.json on every release. It names the official collection,
        # so dropping it would hide that collection from new cars.
        run: |
          set -euo pipefail
          url=https://github.com/complex256/mibpkg-packages/releases/latest/download/sources.json
          curl -fsSL "$url" -o sources.json ||
            curl -fsSL https://raw.githubusercontent.com/complex256/mibpkg/main/packaging/sources.json -o sources.json
      - name: Publish to the official collection
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
          TAG: mib2q-plugins-${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::PACKAGES_TOKEN is not set. Add a token with contents:write on complex256/mibpkg-packages."
            exit 1
          fi
          find packages -type f -name '*.mpk' -print
          ./mibpkg release packages/*.mpk \
            --repo complex256/mibpkg-packages \
            --tag "$TAG" \
            --id complex256-mibpkg \
            --name mibpkg \
            --asset sources.json \
            --out "$RUNNER_TEMP/feed" \
            --publish
      - name: Verify the collection
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: ./mibpkg verify github:complex256/mibpkg-packages --latest
